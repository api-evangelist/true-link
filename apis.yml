description: 'True Link Financial provides financial management tools for people with complex needs and
  their caregivers. Its offerings include the True Link Visa prepaid card with caregiver-configurable
  spending controls and transaction monitoring, investment and trust administration for representative
  payees, fiduciaries, guardians and non-profit trustees, white-label family banking for financial
  institutions, and AI-powered merchant fraud prevention (Retina AI). The company reports serving more
  than 250,000 families. No public developer API or documentation surface was found at the time of
  enrichment; this profile is maintained as a company record in the API Evangelist network.'
